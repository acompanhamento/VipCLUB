<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel Administrativo - AcompanhanteVirtual</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #fdf5f9;

            color: #333;

        }


        header {

            background: white;

            padding: 18px;

            box-shadow: 0 2px 10px rgba(0,0,0,.08);

        }


        .header-conteudo {

            max-width: 1100px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

        }


        .logo {

            color: #e91e63;

            font-size: 23px;

            font-weight: bold;

        }


        button {

            border: none;

            border-radius: 8px;

            padding: 10px 15px;

            cursor: pointer;

            font-weight: bold;

        }


        .btn-sair {

            background: #eee;

            color: #333;

        }


        .container {

            max-width: 1100px;

            margin: auto;

            padding: 25px 15px 50px;

        }


        h1 {

            text-align: center;

            margin-bottom: 25px;

        }


        .painel {

            background: white;

            border-radius: 15px;

            padding: 20px;

            margin-bottom: 25px;

            box-shadow: 0 4px 18px rgba(0,0,0,.07);

        }


        .painel h2 {

            margin-top: 0;

            color: #e91e63;

        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;

        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 11px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 14px;

        }


        textarea {

            min-height: 120px;

            resize: vertical;

        }


        .btn-principal {

            background: #e91e63;

            color: white;

            margin-top: 18px;

        }


        .btn-secundario {

            background: #fce4ec;

            color: #e91e63;

        }


        .btn-perigo {

            background: #ffebee;

            color: #c62828;

        }


        .lista {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 20px;

        }


        .acompanhante {

            background: white;

            border-radius: 15px;

            overflow: hidden;

            box-shadow: 0 4px 18px rgba(0,0,0,.08);

        }


        .acompanhante img {

            width: 100%;

            height: 300px;

            object-fit: cover;

            display: block;

        }


        .acompanhante-info {

            padding: 15px;

        }


        .acompanhante-nome {

            font-size: 20px;

            font-weight: bold;

        }


        .acoes {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-top: 15px;

        }


        .valores {

            margin-top: 20px;

            border-top: 1px solid #eee;

            padding-top: 15px;

        }


        .valor-linha {

            display: grid;

            grid-template-columns: 1fr 130px auto;

            gap: 8px;

            margin-bottom: 8px;

            align-items: center;

        }


        .valor-linha input {

            margin: 0;

        }


        .foto-extra {

            display: inline-block;

            width: 90px;

            height: 90px;

            margin: 5px;

            position: relative;

        }


        .foto-extra img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            border-radius: 8px;

        }


        .foto-extra button {

            position: absolute;

            right: 2px;

            top: 2px;

            padding: 4px 7px;

            background: #c62828;

            color: white;

        }


        .mensagem {

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;

            display: none;

        }


        .sucesso {

            background: #e8f5e9;

            color: #2e7d32;

        }


        .erro {

            background: #ffebee;

            color: #c62828;

        }


        .status {

            display: inline-block;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

        }


        .ativo {

            background: #e8f5e9;

            color: #2e7d32;

        }


        .inativo {

            background: #ffebee;

            color: #c62828;

        }


        @media (max-width: 700px) {

            .lista {

                grid-template-columns: 1fr;

            }

            .valor-linha {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="header-conteudo">

        <div class="logo">
            AcompanhanteVirtual - ADMIN
        </div>

        <button
            class="btn-sair"
            onclick="sair()"
        >
            Sair
        </button>

    </div>

</header>


<main class="container">

    <h1>Painel Administrativo</h1>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <!-- ================================================= -->
    <!-- FORMULÁRIO -->
    <!-- ================================================= -->

    <div class="painel">

        <h2 id="tituloFormulario">
            Adicionar acompanhante
        </h2>


        <input
            type="hidden"
            id="acompanhanteId"
        >


        <label>
            Nome
        </label>

        <input
            type="text"
            id="nome"
            placeholder="Nome"
        >


        <label>
            Idade
        </label>

        <input
            type="number"
            id="idade"
            min="18"
            max="100"
            placeholder="Idade"
        >


        <label>
            WhatsApp
        </label>

        <input
            type="text"
            id="whatsapp"
            placeholder="Ex.: 5584991288951"
        >


        <label>
            Descrição
        </label>

        <textarea
            id="descricao"
            placeholder="Descrição da acompanhante..."
        ></textarea>


        <label>
            Foto principal
        </label>

        <input
            type="file"
            id="fotoPrincipal"
            accept="image/*"
        >


        <div id="fotoPrincipalAtual"></div>


        <label>
            Perfil ativo?
        </label>

        <select id="ativo">

            <option value="true">
                Sim
            </option>

            <option value="false">
                Não
            </option>

        </select>


        <!-- ============================================= -->
        <!-- VALORES -->
        <!-- ============================================= -->

        <div class="valores">

            <h2>
                Tabela de valores
            </h2>

            <p>
                Adicione os serviços e respectivos valores.
            </p>


            <div id="listaValores"></div>


            <button
                type="button"
                class="btn-secundario"
                onclick="adicionarLinhaValor()"
            >
                + Adicionar valor
            </button>

        </div>


        <button
            class="btn-principal"
            onclick="salvarAcompanhante()"
        >
            SALVAR ACOMPANHANTE
        </button>


        <button
            class="btn-secundario"
            onclick="limparFormulario()"
            style="margin-top:10px;"
        >
            LIMPAR
        </button>

    </div>


    <!-- ================================================= -->
    <!-- LISTA -->
    <!-- ================================================= -->

    <div class="painel">

        <h2>
            Acompanhantes cadastradas
        </h2>

        <div
            id="listaAcompanhantes"
            class="lista"
        ></div>

    </div>

</main>


<script src="supabase.js"></script>


<script>

let valoresTemporarios = [];


// =====================================================
// MENSAGEM
// =====================================================

function mostrarMensagem(texto, tipo) {

    const elemento =
        document.getElementById("mensagem");

    elemento.textContent = texto;

    elemento.className =
        "mensagem " + tipo;

    elemento.style.display = "block";

    setTimeout(function() {

        elemento.style.display = "none";

    }, 4000);

}


// =====================================================
// VERIFICAR ADMIN
// =====================================================

async function verificarAdmin() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href = "index.html";

        return false;

    }


    const {
        data: perfil,
        error
    } = await supabaseClient

        .from("perfis")

        .select("usuario")

        .eq("id", user.id)

        .maybeSingle();


    if (
        error ||
        !perfil ||
        perfil.usuario !== "ADMIN"
    ) {

        alert("Acesso permitido somente ao administrador.");

        window.location.href = "index.html";

        return false;

    }


    return true;

}


// =====================================================
// ADICIONAR LINHA DE VALOR
// =====================================================

function adicionarLinhaValor(
    servico = "",
    valor = "",
    id = null
) {

    const lista =
        document.getElementById("listaValores");


    const linha =
        document.createElement("div");

    linha.className =
        "valor-linha";


    const inputServico =
        document.createElement("input");

    inputServico.type = "text";

    inputServico.placeholder =
        "Ex.: 1 hora";

    inputServico.value =
        servico;


    const inputValor =
        document.createElement("input");

    inputValor.type = "number";

    inputValor.step = "0.01";

    inputValor.min = "0";

    inputValor.placeholder =
        "Valor";

    inputValor.value =
        valor;


    const botao =
        document.createElement("button");

    botao.type = "button";

    botao.className =
        "btn-perigo";

    botao.textContent =
        "Excluir";


    botao.onclick = function() {

        linha.remove();

    };


    linha.dataset.id =
        id || "";


    linha.appendChild(
        inputServico
    );

    linha.appendChild(
        inputValor
    );

    linha.appendChild(
        botao
    );


    lista.appendChild(linha);

}


// =====================================================
// PEGAR VALORES DO FORMULÁRIO
// =====================================================

function obterValoresFormulario() {

    const linhas =
        document.querySelectorAll(
            "#listaValores .valor-linha"
        );


    const valores = [];


    linhas.forEach(function(linha) {

        const inputs =
            linha.querySelectorAll("input");


        const servico =
            inputs[0].value.trim();


        const valor =
            parseFloat(inputs[1].value);


        const id =
            linha.dataset.id || null;


        if (
            servico &&
            !isNaN(valor)
        ) {

            valores.push({

                id: id,

                servico: servico,

                valor: valor

            });

        }

    });


    return valores;

}


// =====================================================
// SALVAR VALORES
// =====================================================

async function salvarValores(
    acompanhanteId
) {

    const valores =
        obterValoresFormulario();


    // Buscar valores atuais

    const {
        data: atuais,
        error: erroBusca
    } = await supabaseClient

        .from("valores_acompanhantes")

        .select("*")

        .eq(
            "acompanhante_id",
            acompanhanteId
        );


    if (erroBusca) {

        throw erroBusca;

    }


    const idsMantidos =
        valores

            .filter(function(v) {
                return v.id;
            })

            .map(function(v) {
                return v.id;
            });


    // Excluir os que foram removidos

    for (
        const atual of (atuais || [])
    ) {

        if (
            !idsMantidos.includes(
                atual.id
            )
        ) {

            const {
                error
            } = await supabaseClient

                .from("valores_acompanhantes")

                .delete()

                .eq(
                    "id",
                    atual.id
                );


            if (error) {

                throw error;

            }

        }

    }


    // Salvar valores

    for (
        let i = 0;
        i < valores.length;
        i++
    ) {

        const item =
            valores[i];


        if (item.id) {

            const {
                error
            } = await supabaseClient

                .from("valores_acompanhantes")

                .update({

                    servico:
                        item.servico,

                    valor:
                        item.valor,

                    ordem:
                        i

                })

                .eq(
                    "id",
                    item.id
                );


            if (error) {

                throw error;

            }

        } else {

            const {
                error
            } = await supabaseClient

                .from("valores_acompanhantes")

                .insert({

                    acompanhante_id:
                        acompanhanteId,

                    servico:
                        item.servico,

                    valor:
                        item.valor,

                    ordem:
                        i

                });


            if (error) {

                throw error;

            }

        }

    }

}


// =====================================================
// SALVAR ACOMPANHANTE
// =====================================================

async function salvarAcompanhante() {

    try {

        const id =
            document.getElementById(
                "acompanhanteId"
            ).value;


        const nome =
            document.getElementById(
                "nome"
            ).value.trim();


        const idade =
            parseInt(
                document.getElementById(
                    "idade"
                ).value
            );


        const whatsapp =
            document.getElementById(
                "whatsapp"
            ).value.trim();


        const descricao =
            document.getElementById(
                "descricao"
            ).value.trim();


        const ativo =
            document.getElementById(
                "ativo"
            ).value === "true";


        if (!nome) {

            alert("Informe o nome.");

            return;

        }


        if (
            !idade ||
            idade < 18 ||
            idade > 100
        ) {

            alert("Informe uma idade válida.");

            return;

        }


        if (!whatsapp) {

            alert("Informe o WhatsApp.");

            return;

        }


        let acompanhanteId =
            id;


        // =============================================
        // CRIAR
        // =============================================

        if (!id) {

            const {
                data,
                error
            } = await supabaseClient

                .from("acompanhantes")

                .insert({

                    nome:
                        nome,

                    idade:
                        idade,

                    whatsapp:
                        whatsapp,

                    descricao:
                        descricao,

                    ativo:
                        ativo

                })

                .select()

                .single();


            if (error) {

                throw error;

            }


            acompanhanteId =
                data.id;

        }

        // =============================================
        // EDITAR
        // =============================================

        else {

            const {
                error
            } = await supabaseClient

                .from("acompanhantes")

                .update({

                    nome:
                        nome,

                    idade:
                        idade,

                    whatsapp:
                        whatsapp,

                    descricao:
                        descricao,

                    ativo:
                        ativo,

                    atualizado_em:
                        new Date().toISOString()

                })

                .eq(
                    "id",
                    id
                );


            if (error) {

                throw error;

            }

        }


        // =============================================
        // FOTO PRINCIPAL
        // =============================================

        const arquivo =
            document.getElementById(
                "fotoPrincipal"
            ).files[0];


        if (arquivo) {

            const extensao =
                arquivo.name
                    .split(".")
                    .pop();


            const nomeArquivo =
                "acompanhantes/" +
                acompanhanteId +
                "/principal-" +
                Date.now() +
                "." +
                extensao;


            const {
                error:
                erroUpload
            } = await supabaseClient.storage

                .from("fotos")

                .upload(
                    nomeArquivo,
                    arquivo,
                    {
                        upsert: true
                    }
                );


            if (erroUpload) {

                throw erroUpload;

            }


            const {
                data:
                urlData
            } = supabaseClient.storage

                .from("fotos")

                .getPublicUrl(
                    nomeArquivo
                );


            const {
                error:
                erroFoto
            } = await supabaseClient

                .from("acompanhantes")

                .update({

                    foto_principal:
                        urlData.publicUrl

                })

                .eq(
                    "id",
                    acompanhanteId
                );


            if (erroFoto) {

                throw erroFoto;

            }

        }


        // =============================================
        // VALORES
        // =============================================

        await salvarValores(
            acompanhanteId
        );


        mostrarMensagem(
            "Acompanhante salva com sucesso!",
            "sucesso"
        );


        limparFormulario();

        carregarAcompanhantes();


    } catch (erro) {

        console.error(erro);

        mostrarMensagem(
            "Erro: " +
            erro.message,
            "erro"
        );

    }

}


// =====================================================
// CARREGAR ACOMPANHANTES
// =====================================================

async function carregarAcompanhantes() {

    const {
        data,
        error
    } = await supabaseClient

        .from("acompanhantes")

        .select("*")

        .order(
            "criado_em",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        return;

    }


    const lista =
        document.getElementById(
            "listaAcompanhantes"
        );


    lista.innerHTML = "";


    for (
        const acompanhante of (data || [])
    ) {

        const card =
            document.createElement("div");

        card.className =
            "acompanhante";


        let foto = "";

        if (
            acompanhante.foto_principal
        ) {

            foto =
                "<img src=\"" +
                acompanhante.foto_principal +
                "\" alt=\"" +
                acompanhante.nome +
                "\">";

        } else {

            foto =
                "<div style=\"height:200px;display:flex;align-items:center;justify-content:center;background:#eee;color:#999;\">Sem foto</div>";

        }


        const status =
            acompanhante.ativo
                ? '<span class="status ativo">ATIVO</span>'
                : '<span class="status inativo">INATIVO</span>';


        card.innerHTML =

            foto +

            '<div class="acompanhante-info">' +

            '<div class="acompanhante-nome">' +
            acompanhante.nome +
            '</div>' +

            '<p>' +
            acompanhante.idade +
            ' anos</p>' +

            status +

            '<div class="acoes">' +

            '<button class="btn-secundario" onclick="editarAcompanhante(\'' +
            acompanhante.id +
            '\')">Editar</button>' +

            '<button class="btn-perigo" onclick="excluirAcompanhante(\'' +
            acompanhante.id +
            '\')">Excluir</button>' +

            '</div>' +

            '</div>';


        lista.appendChild(card);

    }

}


// =====================================================
// EDITAR
// =====================================================

async function editarAcompanhante(id) {

    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("acompanhantes")

            .select("*")

            .eq(
                "id",
                id
            )

            .single();


        if (error) {

            throw error;

        }


        document.getElementById(
            "acompanhanteId"
        ).value =
            data.id;


        document.getElementById(
            "nome"
        ).value =
            data.nome;


        document.getElementById(
            "idade"
        ).value =
            data.idade;


        document.getElementById(
            "whatsapp"
        ).value =
            data.whatsapp;


        document.getElementById(
            "descricao"
        ).value =
            data.descricao || "";


        document.getElementById(
            "ativo"
        ).value =
            data.ativo
                ? "true"
                : "false";


        document.getElementById(
            "tituloFormulario"
        ).textContent =
            "Editar acompanhante";


        const fotoAtual =
            document.getElementById(
                "fotoPrincipalAtual"
            );


        if (
            data.foto_principal
        ) {

            fotoAtual.innerHTML =

                '<p>Foto atual:</p>' +

                '<img src="' +
                data.foto_principal +
                '" style="width:120px;height:150px;object-fit:cover;border-radius:10px;">';

        } else {

            fotoAtual.innerHTML =
                "";

        }


        // VALORES

        const {
            data:
            valores,
            error:
            erroValores
        } = await supabaseClient

            .from(
                "valores_acompanhantes"
            )

            .select("*")

            .eq(
                "acompanhante_id",
                id
            )

            .order(
                "ordem",
                {
                    ascending: true
                }
            );


        if (erroValores) {

            throw erroValores;

        }


        const listaValores =
            document.getElementById(
                "listaValores"
            );


        listaValores.innerHTML =
            "";


        (valores || []).forEach(
            function(valor) {

                adicionarLinhaValor(

                    valor.servico,

                    valor.valor,

                    valor.id

                );

            }
        );


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (erro) {

        alert(
            "Erro ao editar: " +
            erro.message
        );

    }

}


// =====================================================
// EXCLUIR
// =====================================================

async function excluirAcompanhante(id) {

    if (
        !confirm(
            "Tem certeza que deseja excluir esta acompanhante?"
        )
    ) {

        return;

    }


    try {

        const {
            error
        } = await supabaseClient

            .from("acompanhantes")

            .delete()

            .eq(
                "id",
                id
            );


        if (error) {

            throw error;

        }


        mostrarMensagem(
            "Acompanhante excluída.",
            "sucesso"
        );


        carregarAcompanhantes();


    } catch (erro) {

        alert(
            "Erro ao excluir: " +
            erro.message
        );

    }

}


// =====================================================
// LIMPAR
// =====================================================

function limparFormulario() {

    document.getElementById(
        "acompanhanteId"
    ).value = "";


    document.getElementById(
        "nome"
    ).value = "";


    document.getElementById(
        "idade"
    ).value = "";


    document.getElementById(
        "whatsapp"
    ).value = "";


    document.getElementById(
        "descricao"
    ).value = "";


    document.getElementById(
        "fotoPrincipal"
    ).value = "";


    document.getElementById(
        "ativo"
    ).value = "true";


    document.getElementById(
        "fotoPrincipalAtual"
    ).innerHTML = "";


    document.getElementById(
        "listaValores"
    ).innerHTML = "";


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Adicionar acompanhante";

}


// =====================================================
// SAIR
// =====================================================

async function sair() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "index.html";

}


// =====================================================
// INICIALIZAÇÃO
// =====================================================

(async function() {

    const autorizado =
        await verificarAdmin();


    if (autorizado) {

        carregarAcompanhantes();

    }

})();

</script>


</body>

</html>
