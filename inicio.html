<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AcompanhanteVirtual</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #fdf5f9;

            color: #333;

            padding-bottom: 70px;

        }


        /* ==========================================
           CABEÇALHO
        ========================================== */

        header {

            background: white;

            border-bottom: 1px solid #eee;

            position: sticky;

            top: 0;

            z-index: 20;

        }


        .header-conteudo {

            max-width: 1200px;

            margin: auto;

            padding: 15px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

        }


        .logo {

            color: #e91e63;

            font-size: 25px;

            font-weight: bold;

        }


        .botoes-header {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .botao-header {

            text-decoration: none;

            border-radius: 8px;

            padding: 9px 14px;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

        }


        .botao-login {

            color: #e91e63;

            background: #fff0f5;

        }


        .botao-cadastro {

            color: white;

            background: #e91e63;

        }


        .botao-header:hover {

            opacity: 0.85;

        }



        /* ==========================================
           CONTEÚDO
        ========================================== */

        .container {

            max-width: 1200px;

            margin: auto;

            padding: 30px 20px;

        }


        .titulo {

            text-align: center;

            margin: 10px 0 5px;

            font-size: 30px;

            color: #333;

        }


        .subtitulo {

            text-align: center;

            margin: 0 0 30px;

            color: #777;

            font-size: 15px;

        }


        /* ==========================================
           GRID
        ========================================== */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

        }


        .card {

            background: white;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .card:hover {

            transform: translateY(-3px);

            box-shadow:
                0 7px 20px rgba(0,0,0,0.12);

        }


        .foto-container {

            width: 100%;

            height: 350px;

            background: #eee;

            overflow: hidden;

        }


        .foto-container img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        .informacoes {

            padding: 14px;

        }


        .nome {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .idade {

            color: #e91e63;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 8px;

        }


        .descricao {

            font-size: 13px;

            color: #666;

            line-height: 1.4;

        }


        /* ==========================================
           CARREGANDO
        ========================================== */

        .carregando {

            text-align: center;

            padding: 40px;

            color: #777;

        }


        .nenhum {

            text-align: center;

            padding: 40px;

            color: #777;

        }


        .erro {

            max-width: 600px;

            margin: 20px auto;

            padding: 15px;

            border-radius: 10px;

            background: #ffe5e5;

            color: #c62828;

            text-align: center;

        }


        .erro small {

            display: block;

            margin-top: 8px;

        }



        /* ==========================================
           RODAPÉ
        ========================================== */

        .rodape {

            position: fixed;

            bottom: 0;

            left: 0;

            width: 100%;

            background: white;

            border-top: 1px solid #eee;

            padding: 10px;

            z-index: 20;

        }


        .rodape-conteudo {

            max-width: 500px;

            margin: auto;

            display: flex;

            justify-content: center;

            gap: 15px;

        }


        .link-rodape {

            color: #e91e63;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            padding: 8px 15px;

        }



        /* ==========================================
           RESPONSIVO
        ========================================== */

        @media (max-width: 900px) {

            .grid {

                grid-template-columns:
                    repeat(3, 1fr);

            }

        }


        @media (max-width: 650px) {

            .header-conteudo {

                padding: 12px;

            }


            .logo {

                font-size: 21px;

            }


            .botao-header {

                padding: 8px 9px;

                font-size: 12px;

            }


            .grid {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;

            }


            .foto-container {

                height: 250px;

            }


            .titulo {

                font-size: 23px;

            }

        }


        @media (max-width: 420px) {

            .grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .foto-container {

                height: 210px;

            }


            .informacoes {

                padding: 10px;

            }


            .nome {

                font-size: 16px;

            }


            .descricao {

                font-size: 12px;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     CABEÇALHO
========================================== -->

<header>

    <div class="header-conteudo">


        <div class="logo">

            AcompanhanteVirtual

        </div>


        <!--
            O JavaScript vai colocar
            os botões aqui.
        -->

        <div
            class="botoes-header"
            id="menuHeader"
        >

            <span>
                Carregando...
            </span>

        </div>


    </div>

</header>



<!-- ==========================================
     CONTEÚDO
========================================== -->

<main class="container">


    <h1 class="titulo">

        Encontre sua companhia

    </h1>


    <p class="subtitulo">

        Confira os perfis disponíveis

    </p>


    <div id="mensagemErro"></div>


    <div
        id="carregando"
        class="carregando"
    >

        Carregando perfis...

    </div>


    <div
        id="nenhum"
        class="nenhum"
        style="display:none;"
    >

        Nenhum perfil disponível no momento.

    </div>


    <div
        id="listaAcompanhantes"
        class="grid"
    ></div>


</main>



<!-- ==========================================
     RODAPÉ
========================================== -->

<div class="rodape">

    <div
        class="rodape-conteudo"
        id="menuRodape"
    >

        <span>
            Carregando...
        </span>

    </div>

</div>



<script src="supabase.js"></script>


<script>


/* ==========================================
   CONFIGURAR MENU
========================================== */

async function configurarMenu() {


    const menuHeader =
        document.getElementById(
            "menuHeader"
        );


    const menuRodape =
        document.getElementById(
            "menuRodape"
        );


    try {


        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Erro ao verificar sessão:",
                error
            );

        }



        /* ======================================
           USUÁRIO LOGADO
        ====================================== */

        if (
            data &&
            data.session
        ) {


            menuHeader.innerHTML = `

                <a
                    href="inicio.html"
                    class="botao-header botao-login"
                >
                    Início
                </a>


                <a
                    href="perfil.html"
                    class="botao-header botao-login"
                >
                    Meu Perfil
                </a>


                <a
                    href="#"
                    onclick="sair(); return false;"
                    class="botao-header botao-cadastro"
                >
                    Sair
                </a>

            `;



            menuRodape.innerHTML = `

                <a
                    href="inicio.html"
                    class="link-rodape"
                >
                    Início
                </a>


                <a
                    href="perfil.html"
                    class="link-rodape"
                >
                    Meu Perfil
                </a>


                <a
                    href="#"
                    onclick="sair(); return false;"
                    class="link-rodape"
                >
                    Sair
                </a>

            `;


        }

        /* ======================================
           USUÁRIO NÃO LOGADO
        ====================================== */

        else {


            menuHeader.innerHTML = `

                <a
                    href="index.html"
                    class="botao-header botao-login"
                >
                    Entrar
                </a>


                <a
                    href="index.html"
                    class="botao-header botao-cadastro"
                    onclick="abrirCadastro()"
                >
                    Criar conta
                </a>

            `;



            menuRodape.innerHTML = `

                <a
                    href="index.html"
                    class="link-rodape"
                >
                    Minha conta
                </a>


                <a
                    href="index.html"
                    class="link-rodape"
                >
                    Entrar
                </a>

            `;

        }


    } catch (erro) {

        console.error(
            "Erro no menu:",
            erro
        );

    }

}



/* ==========================================
   SAIR
========================================== */

async function sair() {


    try {

        await supabaseClient.auth.signOut();

    } catch (erro) {

        console.error(
            "Erro ao sair:",
            erro
        );

    }


    window.location.href =
        "index.html";

}



/* ==========================================
   ABRIR CADASTRO
========================================== */

function abrirCadastro() {

    /*
     * O index.html controla
     * a tela de cadastro.
     *
     * O parâmetro ?cadastro=1
     * permite que ele abra
     * diretamente no cadastro.
     */

    window.location.href =
        "index.html?cadastro=1";

}



/* ==========================================
   ESCAPAR HTML
========================================== */

function escapeHTML(valor) {

    if (valor === null ||
        valor === undefined) {

        return "";

    }


    return String(valor)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



/* ==========================================
   CARREGAR ACOMPANHANTES
========================================== */

async function carregarAcompanhantes() {


    const carregando =
        document.getElementById(
            "carregando"
        );


    const lista =
        document.getElementById(
            "listaAcompanhantes"
        );


    const nenhum =
        document.getElementById(
            "nenhum"
        );


    const mensagemErro =
        document.getElementById(
            "mensagemErro"
        );


    try {


        const {
            data,
            error
        } =
            await supabaseClient

                .from("acompanhantes")

                .select("*")

                .eq("ativo", true)

                .order(
                    "criado_em",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }


        carregando.style.display =
            "none";


        if (
            !data ||
            data.length === 0
        ) {

            nenhum.style.display =
                "block";

            return;

        }


        lista.innerHTML = "";


        data.forEach(
            function(acompanhante) {

                criarCard(
                    acompanhante
                );

            }
        );


    } catch (erro) {


        console.error(
            "Erro ao carregar acompanhantes:",
            erro
        );


        carregando.style.display =
            "none";


        mensagemErro.innerHTML = `

            <div class="erro">

                Erro ao carregar os perfis.

                <small>
                    ${
                        escapeHTML(
                            erro.message ||
                            "Erro desconhecido"
                        )
                    }
                </small>

            </div>

        `;

    }

}



/* ==========================================
   CRIAR CARD
========================================== */

function criarCard(acompanhante) {


    const lista =
        document.getElementById(
            "listaAcompanhantes"
        );


    const card =
        document.createElement("div");


    card.className =
        "card";


    card.onclick =
        function() {

            abrirPerfil(
                acompanhante.id
            );

        };



    const foto =
        acompanhante.foto_principal ||
        "https://via.placeholder.com/600x800?text=Sem+foto";



    card.innerHTML = `

        <div class="foto-container">

            <img
                src="${escapeHTML(foto)}"
                alt="${escapeHTML(acompanhante.nome)}"
                loading="lazy"
            >

        </div>


        <div class="informacoes">

            <div class="nome">

                ${escapeHTML(
                    acompanhante.nome
                )}

            </div>


            <div class="idade">

                ${escapeHTML(
                    acompanhante.idade
                )} anos

            </div>


            <div class="descricao">

                ${escapeHTML(
                    acompanhante.descricao || ""
                )}

            </div>

        </div>

    `;


    lista.appendChild(card);

}



/* ==========================================
   ABRIR PERFIL DO ACOMPANHANTE
========================================== */

function abrirPerfil(id) {


    window.location.href =
        "pessoa.html?id=" +
        encodeURIComponent(id);

}



/* ==========================================
   INICIAR
========================================== */

configurarMenu();

carregarAcompanhantes();


</script>


</body>

</html>
