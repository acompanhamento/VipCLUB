<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AcompanhanteVirtual</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fdf5f9;
            color: #333;
            padding-bottom: 70px;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        header {
            background: white;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-conteudo {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 15px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            color: #e91e63;
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
        }

        .botoes-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .botao-header {
            text-decoration: none;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .botao-login {
            background: #f5f5f5;
            color: #333;
        }

        .botao-cadastro {
            background: #e91e63;
            color: white;
        }

        .botao-perfil {
            background: #f5f5f5;
            color: #e91e63;
        }

        .botao-sair {
            background: #ffe5e5;
            color: #c62828;
        }

        /* =========================
           CONTEÚDO
        ========================= */

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 40px;
        }

        .titulo {
            text-align: center;
            color: #333;
            margin: 10px 0 8px;
            font-size: 30px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            margin: 0 0 30px;
            font-size: 15px;
        }

        /* =========================
           GRID
        ========================= */

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .foto-container {
            width: 100%;
            height: 330px;
            background: #eee;
            overflow: hidden;
        }

        .foto-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sem-foto {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }

        .informacoes {
            padding: 15px;
        }

        .nome {
            font-size: 19px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .idade {
            font-size: 14px;
            color: #e91e63;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .descricao {
            font-size: 13px;
            color: #777;
            line-height: 1.4;
        }

        /* =========================
           MENSAGENS
        ========================= */

        .carregando {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        .nenhum {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        .erro {
            background: #ffe5e5;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .erro small {
            display: block;
            margin-top: 5px;
        }

        /* =========================
           RODAPÉ
        ========================= */

        .rodape {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            border-top: 1px solid #eee;
            padding: 10px;
            z-index: 20;
        }

        .rodape-conteudo {
            max-width: 600px;
            margin: auto;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .link-rodape {
            color: #e91e63;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 15px;
            cursor: pointer;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 900px) {

            .grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 650px) {

            .header-conteudo {
                padding: 12px;
            }

            .logo {
                font-size: 20px;
            }

            .botao-header {
                padding: 8px 9px;
                font-size: 12px;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .foto-container {
                height: 250px;
            }

            .container {
                padding: 25px 12px 35px;
            }

            .titulo {
                font-size: 23px;
            }

            .subtitulo {
                font-size: 13px;
            }

            .informacoes {
                padding: 10px;
            }

            .nome {
                font-size: 16px;
            }

            .descricao {
                font-size: 12px;
            }

        }

        @media (max-width: 420px) {

            .logo {
                font-size: 18px;
            }

            .botoes-header {
                gap: 4px;
            }

            .botao-header {
                padding: 7px 7px;
                font-size: 11px;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .foto-container {
                height: 210px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     CABEÇALHO
========================= -->

<header>

    <div class="header-conteudo">

        <div class="logo">
            AcompanhanteVirtual
        </div>

        <div
            class="botoes-header"
            id="menuHeader"
        >

            <!--
                O menu será preenchido
                automaticamente pelo JavaScript.
            -->

        </div>

    </div>

</header>


<!-- =========================
     CONTEÚDO
========================= -->

<main class="container">

    <h1 class="titulo">
        Encontre sua companhia
    </h1>

    <p class="subtitulo">
        Confira os perfis disponíveis
    </p>


    <div id="mensagemErro"></div>


    <div
        id="carregando"
        class="carregando"
    >
        Carregando perfis...
    </div>


    <div
        id="nenhum"
        class="nenhum"
        style="display:none;"
    >
        Nenhum perfil disponível no momento.
    </div>


    <div
        id="listaAcompanhantes"
        class="grid"
    ></div>

</main>


<!-- =========================
     RODAPÉ
========================= -->

<div class="rodape">

    <div
        class="rodape-conteudo"
        id="menuRodape"
    >

        <!--
            O menu será preenchido
            automaticamente.
        -->

    </div>

</div>


<!-- SUPABASE -->

<script src="supabase.js"></script>


<script>


    // ==================================================
    // CONFIGURAR MENU DE ACORDO COM O LOGIN
    // ==================================================

    async function configurarMenu() {

        const menuHeader =
            document.getElementById("menuHeader");

        const menuRodape =
            document.getElementById("menuRodape");


        try {

            const { data, error } =
                await supabaseClient.auth.getSession();


            if (error) {
                throw error;
            }


            const sessao =
                data.session;


            // ==========================================
            // USUÁRIO ESTÁ LOGADO
            // ==========================================

            if (sessao) {

                menuHeader.innerHTML = `

                    <a
                        href="inicio.html"
                        class="botao-header botao-login"
                    >
                        Início
                    </a>

                    <a
                        href="perfil.html"
                        class="botao-header botao-perfil"
                    >
                        Meu Perfil
                    </a>

                    <button
                        type="button"
                        class="botao-header botao-sair"
                        onclick="sair()"
                    >
                        Sair
                    </button>

                `;


                menuRodape.innerHTML = `

                    <a
                        href="inicio.html"
                        class="link-rodape"
                    >
                        Início
                    </a>

                    <a
                        href="perfil.html"
                        class="link-rodape"
                    >
                        Meu Perfil
                    </a>

                    <a
                        href="#"
                        class="link-rodape"
                        onclick="sair(); return false;"
                    >
                        Sair
                    </a>

                `;

                return;
            }


            // ==========================================
            // USUÁRIO NÃO ESTÁ LOGADO
            // ==========================================

            menuHeader.innerHTML = `

                <a
                    href="index.html"
                    class="botao-header botao-login"
                >
                    Entrar
                </a>

                <a
                    href="index.html"
                    class="botao-header botao-cadastro"
                >
                    Criar conta
                </a>

            `;


            menuRodape.innerHTML = `

                <a
                    href="index.html"
                    class="link-rodape"
                >
                    Minha conta
                </a>

                <a
                    href="index.html"
                    class="link-rodape"
                >
                    Entrar
                </a>

            `;


        } catch (erro) {

            console.error(
                "Erro ao verificar sessão:",
                erro
            );


            // Se houver erro, mantém
            // o menu de visitante.

            menuHeader.innerHTML = `

                <a
                    href="index.html"
                    class="botao-header botao-login"
                >
                    Entrar
                </a>

                <a
                    href="index.html"
                    class="botao-header botao-cadastro"
                >
                    Criar conta
                </a>

            `;


            menuRodape.innerHTML = `

                <a
                    href="index.html"
                    class="link-rodape"
                >
                    Minha conta
                </a>

                <a
                    href="index.html"
                    class="link-rodape"
                >
                    Entrar
                </a>

            `;

        }

    }


    // ==================================================
    // SAIR DA CONTA
    // ==================================================

    async function sair() {

        try {

            const { error } =
                await supabaseClient.auth.signOut();


            if (error) {
                throw error;
            }


            window.location.href =
                "index.html";


        } catch (erro) {

            console.error(
                "Erro ao sair:",
                erro
            );

            alert(
                "Não foi possível sair da conta."
            );

        }

    }


    // ==================================================
    // CARREGAR ACOMPANHANTES
    // ==================================================

    async function carregarAcompanhantes() {

        const carregando =
            document.getElementById("carregando");

        const lista =
            document.getElementById("listaAcompanhantes");

        const nenhum =
            document.getElementById("nenhum");

        const mensagemErro =
            document.getElementById("mensagemErro");


        try {

            const { data, error } =
                await supabaseClient

                    .from("acompanhantes")

                    .select("*")

                    .eq("ativo", true)

                    .order(
                        "criado_em",
                        {
                            ascending: false
                        }
                    );


            if (error) {
                throw error;
            }


            carregando.style.display =
                "none";


            if (!data || data.length === 0) {

                nenhum.style.display =
                    "block";

                return;

            }


            lista.innerHTML = "";


            data.forEach(
                function(acompanhante) {

                    criarCard(
                        acompanhante
                    );

                }
            );


        } catch (erro) {

            console.error(
                "Erro ao carregar acompanhantes:",
                erro
            );


            carregando.style.display =
                "none";


            mensagemErro.innerHTML =

                '<div class="erro">' +

                'Erro ao carregar os perfis.<br>' +

                '<small>' +

                (
                    erro.message ||
                    "Erro desconhecido"
                ) +

                '</small>' +

                '</div>';

        }

    }


    // ==================================================
    // CRIAR CARD
    // ==================================================

    function criarCard(acompanhante) {

        const lista =
            document.getElementById(
                "listaAcompanhantes"
            );


        const card =
            document.createElement("div");


        card.className =
            "card";


        card.onclick =
            function() {

                abrirPerfil(
                    acompanhante.id
                );

            };


        let fotoHTML = "";


        if (
            acompanhante.foto_principal &&
            acompanhante.foto_principal.trim() !== ""
        ) {

            fotoHTML = `

                <img
                    src="${acompanhante.foto_principal}"
                    alt="${escapeHTML(acompanhante.nome)}"
                >

            `;

        } else {

            fotoHTML = `

                <div class="sem-foto">
                    Sem foto
                </div>

            `;

        }


        card.innerHTML = `

            <div class="foto-container">

                ${fotoHTML}

            </div>


            <div class="informacoes">

                <div class="nome">
                    ${escapeHTML(acompanhante.nome)}
                </div>


                <div class="idade">
                    ${acompanhante.idade} anos
                </div>


                <div class="descricao">
                    ${
                        acompanhante.descricao
                            ? escapeHTML(
                                acompanhante.descricao
                              )
                            : ""
                    }
                </div>

            </div>

        `;


        lista.appendChild(card);

    }


    // ==================================================
    // ABRIR PERFIL
    // ==================================================

    function abrirPerfil(id) {

        window.location.href =
            "pessoa.html?id=" +
            encodeURIComponent(id);

    }


    // ==================================================
    // PROTEGER TEXTO INSERIDO NO HTML
    // ==================================================

    function escapeHTML(texto) {

        if (texto === null ||
            texto === undefined) {

            return "";

        }


        return String(texto)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    // ==================================================
    // INICIAR
    // ==================================================

    configurarMenu();

    carregarAcompanhantes();


</script>


</body>

</html>
