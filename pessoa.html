<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - AcompanhanteVirtual</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #faf5f8;
            color: #333;
        }

        header {
            background: #fff;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            padding: 16px 20px;
        }

        .header {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            color: #e91e63;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .voltar {
            text-decoration: none;
            color: #e91e63;
            font-weight: bold;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 25px 15px 60px;
        }

        .perfil {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        .principal {
            width: 100%;
            max-height: 700px;
            background: #111;
            display: flex;
            justify-content: center;
        }

        .principal img,
        .principal video {
            width: 100%;
            max-height: 700px;
            object-fit: contain;
            display: block;
        }

        .informacoes {
            padding: 25px;
        }

        .nome {
            color: #e91e63;
            font-size: 30px;
            font-weight: bold;
        }

        .idade {
            font-size: 18px;
            color: #666;
            margin-top: 5px;
        }

        .descricao {
            margin-top: 20px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .whatsapp {
            display: inline-block;
            margin-top: 22px;
            padding: 13px 20px;
            border-radius: 9px;
            background: #25D366;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .galeria {
            margin-top: 25px;
        }

        .galeria h2 {
            color: #e91e63;
            margin-bottom: 15px;
        }

        .fotos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .foto {
            height: 320px;
            border-radius: 10px;
            overflow: hidden;
            background: #eee;
            cursor: pointer;
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .sem-fotos {
            color: #777;
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.9);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
        }

        .fechar {
            position: fixed;
            top: 15px;
            right: 20px;
            width: 45px;
            height: 45px;
            border: 0;
            border-radius: 50%;
            background: white;
            color: #333;
            font-size: 25px;
            cursor: pointer;
        }

        @media(max-width: 700px) {

            .header {
                flex-direction: column;
            }

            .nome {
                font-size: 25px;
            }

            .fotos {
                grid-template-columns: repeat(2, 1fr);
            }

            .foto {
                height: 260px;
            }

        }

        @media(max-width: 450px) {

            .fotos {
                grid-template-columns: 1fr;
            }

            .foto {
                height: 400px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="header">

        <a
            href="inicio.html"
            class="logo"
        >
            AcompanhanteVirtual
        </a>

        <a
            href="inicio.html"
            class="voltar"
        >
            ← Voltar
        </a>

    </div>

</header>


<main>

    <div id="conteudo">
        Carregando perfil...
    </div>

</main>


<!-- MODAL DAS FOTOS -->

<div
    id="modal"
    class="modal"
    onclick="fecharModal()"
>

    <button
        class="fechar"
        onclick="fecharModal()"
    >
        ×
    </button>

    <img
        id="imagemModal"
        src=""
        alt=""
    >

</div>


<script src="supabase.js"></script>

<script>


/* =========================================
   ID DA URL
========================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );

const acompanhanteId =
    parametros.get("id");


/* =========================================
   ESCAPAR HTML
========================================= */

function escapeHtml(texto) {

    const div =
        document.createElement("div");

    div.textContent =
        texto || "";

    return div.innerHTML;
}


/* =========================================
   WHATSAPP
========================================= */

function whatsappLink(numero) {

    let numeroLimpo =
        String(numero || "")
            .replace(/\D/g, "");


    /*
      Se o número não tiver
      código do Brasil, adiciona 55.
    */

    if (
        numeroLimpo.length > 0 &&
        !numeroLimpo.startsWith("55")
    ) {

        numeroLimpo =
            "55" +
            numeroLimpo;
    }


    return "https://wa.me/" +
        numeroLimpo;
}


/* =========================================
   CARREGAR PERFIL
========================================= */

async function carregarPerfil() {

    const container =
        document.getElementById(
            "conteudo"
        );


    if (!acompanhanteId) {

        container.innerHTML =
            "<p>Perfil não encontrado.</p>";

        return;
    }


    /*
      BUSCAR ACOMPANHANTE
    */

    const {
        data: acompanhante,
        error
    } =
        await supabaseClient
            .from("acompanhantes")
            .select("*")
            .eq(
                "id",
                acompanhanteId
            )
            .eq(
                "ativo",
                true
            )
            .single();


    if (error || !acompanhante) {

        console.error(error);

        container.innerHTML =
            "<p>Essa acompanhante não está disponível.</p>";

        return;
    }


    /*
      BUSCAR TODAS AS FOTOS ADICIONAIS
    */

    const {
        data: fotos,
        error: erroFotos
    } =
        await supabaseClient
            .from("fotos_acompanhantes")
            .select("*")
            .eq(
                "acompanhante_id",
                acompanhanteId
            )
            .order(
                "ordem",
                {
                    ascending: true
                }
            );


    if (erroFotos) {

        console.error(
            "Erro nas fotos:",
            erroFotos
        );
    }


    /*
      HTML PRINCIPAL
    */

    const perfil =
        document.createElement("div");

    perfil.className =
        "perfil";


    /*
      MÍDIA PRINCIPAL
    */

    const principal =
        document.createElement("div");

    principal.className =
        "principal";


    if (
        acompanhante.tipo_midia_principal ===
            "video" &&
        acompanhante.video_principal
    ) {

        const video =
            document.createElement("video");

        video.src =
            acompanhante.video_principal;

        video.controls = true;

        video.autoplay = true;

        video.muted = true;

        video.loop = true;

        video.playsInline = true;

        video.preload = "metadata";


        principal.appendChild(
            video
        );

    }

    else if (
        acompanhante.foto_principal
    ) {

        const img =
            document.createElement("img");

        img.src =
            acompanhante.foto_principal;

        img.alt =
            acompanhante.nome;


        principal.appendChild(
            img
        );

    }

    else {

        principal.innerHTML =
            "<div style='padding:80px;color:white'>Sem mídia principal.</div>";
    }


    perfil.appendChild(
        principal
    );


    /*
      INFORMAÇÕES
    */

    const informacoes =
        document.createElement("div");

    informacoes.className =
        "informacoes";


    informacoes.innerHTML = `

        <div class="nome">
            ${escapeHtml(
                acompanhante.nome
            )}
        </div>

        <div class="idade">
            ${acompanhante.idade} anos
        </div>

        <div class="descricao">
            ${escapeHtml(
                acompanhante.descricao || ""
            )}
        </div>

        <a
            class="whatsapp"
            href="${whatsappLink(
                acompanhante.whatsapp
            )}"
            target="_blank"
            rel="noopener noreferrer"
        >
            Falar no WhatsApp
        </a>

    `;


    perfil.appendChild(
        informacoes
    );


    /*
      GALERIA
    */

    const galeria =
        document.createElement("div");

    galeria.className =
        "galeria";


    galeria.innerHTML =
        "<h2>Fotos</h2>";


    const fotosContainer =
        document.createElement("div");

    fotosContainer.className =
        "fotos";


    if (
        fotos &&
        fotos.length > 0
    ) {

        fotos.forEach(
            foto => {

                const item =
                    document.createElement("div");

                item.className =
                    "foto";


                const img =
                    document.createElement("img");

                img.src =
                    foto.foto_url;

                img.alt =
                    acompanhante.nome;

                img.loading =
                    "lazy";


                item.onclick =
                    () => abrirModal(
                        foto.foto_url
                    );


                item.appendChild(
                    img
                );


                fotosContainer.appendChild(
                    item
                );

            }
        );

    } else {

        fotosContainer.innerHTML =
            "<div class='sem-fotos'>Nenhuma foto adicional disponível.</div>";
    }


    galeria.appendChild(
        fotosContainer
    );


    perfil.appendChild(
        galeria
    );


    container.innerHTML = "";

    container.appendChild(
        perfil
    );
}


/* =========================================
   MODAL
========================================= */

function abrirModal(url) {

    const modal =
        document.getElementById(
            "modal"
        );

    const imagem =
        document.getElementById(
            "imagemModal"
        );


    imagem.src = url;

    modal.style.display =
        "flex";
}


function fecharModal() {

    document.getElementById(
        "modal"
    ).style.display =
        "none";

    document.getElementById(
        "imagemModal"
    ).src = "";
}


/* =========================================
   INICIAR
========================================= */

carregarPerfil();

</script>

</body>
</html>
