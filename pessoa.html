<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - AcompanhanteVirtual</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #fdf5f9;

            color: #333;

        }


        header {

            background: white;

            padding: 18px 20px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.08);

        }


        .header-conteudo {

            max-width: 900px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .logo {

            color: #e91e63;

            font-size: 23px;

            font-weight: bold;

        }


        .voltar {

            text-decoration: none;

            color: #e91e63;

            font-weight: bold;

        }


        .container {

            max-width: 900px;

            margin: auto;

            padding: 25px 15px 60px;

        }


        .perfil {

            background: white;

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                0 4px 20px
                rgba(0,0,0,.08);

        }


        .foto-principal {

            width: 100%;

            max-height: 600px;

            object-fit: cover;

            border-radius: 15px;

            display: block;

            margin-bottom: 20px;

        }


        .sem-foto {

            width: 100%;

            height: 350px;

            background: #eee;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #999;

        }


        h1 {

            margin-bottom: 5px;

        }


        .idade {

            color: #e91e63;

            font-weight: bold;

            margin-bottom: 25px;

        }


        .secao {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #eee;

        }


        .secao h2 {

            color: #e91e63;

            margin-top: 0;

        }


        .descricao {

            color: #555;

            line-height: 1.7;

            white-space: pre-wrap;

        }


        /* GALERIA */

        .galeria {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-top: 15px;

        }


        .galeria img {

            width: 100%;

            height: 150px;

            object-fit: cover;

            border-radius: 10px;

            cursor: pointer;

        }


        /* TABELA DE VALORES */

        .tabela-valores {

            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;

            overflow: hidden;

            border-radius: 10px;

        }


        .tabela-valores th {

            background: #e91e63;

            color: white;

            padding: 13px;

            text-align: left;

        }


        .tabela-valores td {

            padding: 13px;

            border-bottom: 1px solid #eee;

        }


        .tabela-valores tr:last-child td {

            border-bottom: none;

        }


        .valor {

            color: #e91e63;

            font-weight: bold;

            text-align: right;

            white-space: nowrap;

        }


        .sem-valores {

            color: #777;

            font-size: 14px;

        }


        /* WHATSAPP */

        .whatsapp {

            display: block;

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border-radius: 10px;

            background: #25D366;

            color: white;

            text-align: center;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;

        }


        .carregando {

            text-align: center;

            padding: 50px;

            color: #777;

        }


        .erro {

            background: #ffebee;

            color: #c62828;

            padding: 15px;

            border-radius: 10px;

            text-align: center;

        }


        @media (max-width: 600px) {

            .galeria {

                grid-template-columns:
                    repeat(3, 1fr);

            }


            .galeria img {

                height: 110px;

            }


            .perfil {

                padding: 15px;

            }


            .foto-principal {

                max-height: 500px;

            }

        }


    </style>

</head>


<body>


<header>

    <div class="header-conteudo">

        <div class="logo">
            AcompanhanteVirtual
        </div>

        <a
            href="inicio.html"
            class="voltar"
        >
            ← Voltar
        </a>

    </div>

</header>


<main class="container">


    <div id="carregando" class="carregando">

        Carregando perfil...

    </div>


    <div
        id="erro"
        style="display:none;"
    ></div>


    <div
        id="perfil"
        class="perfil"
        style="display:none;"
    >


        <!-- FOTO PRINCIPAL -->

        <div id="fotoPrincipal"></div>


        <!-- INFORMAÇÕES -->

        <h1 id="nome"></h1>

        <div
            id="idade"
            class="idade"
        ></div>


        <!-- GALERIA -->

        <div
            id="secaoGaleria"
            class="secao"
            style="display:none;"
        >

            <h2>
                Fotos
            </h2>

            <div
                id="galeria"
                class="galeria"
            ></div>

        </div>


        <!-- DESCRIÇÃO -->

        <div class="secao">

            <h2>
                Sobre
            </h2>

            <div
                id="descricao"
                class="descricao"
            ></div>

        </div>


        <!-- VALORES -->

        <div
            id="secaoValores"
            class="secao"
            style="display:none;"
        >

            <h2>
                Valores
            </h2>


            <table
                class="tabela-valores"
            >

                <thead>

                    <tr>

                        <th>
                            Serviço
                        </th>

                        <th>
                            Valor
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="tabelaValores"
                ></tbody>

            </table>

        </div>


        <!-- WHATSAPP -->

        <a
            id="whatsapp"
            class="whatsapp"
            target="_blank"
            rel="noopener noreferrer"
        >
            💬 Entrar em contato pelo WhatsApp
        </a>


    </div>

</main>


<script src="supabase.js"></script>


<script>


// =====================================================
// PEGAR ID DA URL
// =====================================================

const parametros =
    new URLSearchParams(
        window.location.search
    );


const acompanhanteId =
    parametros.get("id");


// =====================================================
// FORMATAR WHATSAPP
// =====================================================

function formatarWhatsapp(numero) {

    let telefone =
        String(numero || "")
            .replace(/\D/g, "");


    /*
     * Se o número não tiver
     * código do Brasil,
     * adicionamos 55.
     */

    if (
        telefone.length > 0 &&
        !telefone.startsWith("55")
    ) {

        telefone =
            "55" + telefone;

    }


    return telefone;

}


// =====================================================
// FORMATAR VALOR
// =====================================================

function formatarValor(valor) {

    return Number(valor)
        .toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );

}


// =====================================================
// CARREGAR PERFIL
// =====================================================

async function carregarPerfil() {

    if (!acompanhanteId) {

        mostrarErro(
            "Perfil não encontrado."
        );

        return;

    }


    try {

        // =================================================
        // ACOMPANHANTE
        // =================================================

        const {
            data:
            acompanhante,
            error:
            erroAcompanhante
        } = await supabaseClient

            .from("acompanhantes")

            .select("*")

            .eq(
                "id",
                acompanhanteId
            )

            .eq(
                "ativo",
                true
            )

            .maybeSingle();


        if (erroAcompanhante) {

            throw erroAcompanhante;

        }


        if (!acompanhante) {

            mostrarErro(
                "Este perfil não está disponível."
            );

            return;

        }


        // =================================================
        // INFORMAÇÕES
        // =================================================

        document.getElementById(
            "nome"
        ).textContent =
            acompanhante.nome;


        document.getElementById(
            "idade"
        ).textContent =
            acompanhante.idade +
            " anos";


        document.getElementById(
            "descricao"
        ).textContent =
            acompanhante.descricao ||
            "Nenhuma descrição informada.";


        // =================================================
        // FOTO PRINCIPAL
        // =================================================

        const fotoPrincipal =
            document.getElementById(
                "fotoPrincipal"
            );


        if (
            acompanhante.foto_principal
        ) {

            const imagem =
                document.createElement("img");


            imagem.src =
                acompanhante.foto_principal;


            imagem.alt =
                acompanhante.nome;


            imagem.className =
                "foto-principal";


            fotoPrincipal.appendChild(
                imagem
            );

        }

        else {

            fotoPrincipal.innerHTML =
                '<div class="sem-foto">Sem foto</div>';

        }


        // =================================================
        // GALERIA
        // =================================================

        const {
            data:
            fotos,
            error:
            erroFotos
        } = await supabaseClient

            .from("fotos_acompanhantes")

            .select("*")

            .eq(
                "acompanhante_id",
                acompanhanteId
            )

            .order(
                "ordem",
                {
                    ascending: true
                }
            );


        if (erroFotos) {

            throw erroFotos;

        }


        const galeria =
            document.getElementById(
                "galeria"
            );


        if (
            fotos &&
            fotos.length > 0
        ) {

            document.getElementById(
                "secaoGaleria"
            ).style.display =
                "block";


            fotos.forEach(
                function(foto) {

                    const imagem =
                        document.createElement(
                            "img"
                        );


                    imagem.src =
                        foto.foto_url;


                    imagem.alt =
                        acompanhante.nome;


                    imagem.loading =
                        "lazy";


                    imagem.onclick =
                        function() {

                            window.open(
                                foto.foto_url,
                                "_blank"
                            );

                        };


                    galeria.appendChild(
                        imagem
                    );

                }
            );

        }


        // =================================================
        // VALORES
        // =================================================

        const {
            data:
            valores,
            error:
            erroValores
        } = await supabaseClient

            .from(
                "valores_acompanhantes"
            )

            .select("*")

            .eq(
                "acompanhante_id",
                acompanhanteId
            )

            .order(
                "ordem",
                {
                    ascending: true
                }
            );


        if (erroValores) {

            throw erroValores;

        }


        const tabela =
            document.getElementById(
                "tabelaValores"
            );


        tabela.innerHTML = "";


        if (
            valores &&
            valores.length > 0
        ) {

            document.getElementById(
                "secaoValores"
            ).style.display =
                "block";


            valores.forEach(
                function(item) {

                    const tr =
                        document.createElement(
                            "tr"
                        );


                    const tdServico =
                        document.createElement(
                            "td"
                        );


                    tdServico.textContent =
                        item.servico;


                    const tdValor =
                        document.createElement(
                            "td"
                        );


                    tdValor.className =
                        "valor";


                    tdValor.textContent =
                        formatarValor(
                            item.valor
                        );


                    tr.appendChild(
                        tdServico
                    );


                    tr.appendChild(
                        tdValor
                    );


                    tabela.appendChild(
                        tr
                    );

                }
            );

        }


        // =================================================
        // WHATSAPP
        // =================================================

        const telefone =
            formatarWhatsapp(
                acompanhante.whatsapp
            );


        if (telefone) {

            document.getElementById(
                "whatsapp"
            ).href =
                "https://wa.me/" +
                telefone;

        }

        else {

            document.getElementById(
                "whatsapp"
            ).style.display =
                "none";

        }


        // =================================================
        // MOSTRAR
        // =================================================

        document.getElementById(
            "carregando"
        ).style.display =
            "none";


        document.getElementById(
            "perfil"
        ).style.display =
            "block";


    } catch (erro) {

        console.error(erro);

        mostrarErro(
            "Erro ao carregar o perfil: " +
            erro.message
        );

    }

}


// =====================================================
// ERRO
// =====================================================

function mostrarErro(mensagem) {

    document.getElementById(
        "carregando"
    ).style.display =
        "none";


    const erro =
        document.getElementById(
            "erro"
        );


    erro.className =
        "erro";


    erro.textContent =
        mensagem;


    erro.style.display =
        "block";

}


// =====================================================
// INICIAR
// =====================================================

carregarPerfil();


</script>


</body>

</html>
