<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - AcompanhanteVirtual</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f7f7f7;

            color: #222;
        }


        header {
            background: white;

            border-bottom: 1px solid #ddd;

            padding: 15px 25px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        .logo {
            font-size: 23px;

            font-weight: bold;

            color: #e60000;

            text-decoration: none;
        }


        .menu {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .menu a,
        .menu button {
            text-decoration: none;

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 15px;

            color: #333;

            padding: 9px 13px;

            border-radius: 7px;
        }


        .menu a:hover,
        .menu button:hover {
            background: #f1f1f1;
        }


        .menu .principal {
            background: #e60000;

            color: white;
        }


        .escondido {
            display: none !important;
        }


        .container {
            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

            padding: 30px 20px 60px;
        }


        .voltar {
            display: inline-block;

            margin-bottom: 20px;

            color: #555;

            text-decoration: none;
        }


        .voltar:hover {
            text-decoration: underline;
        }


        .perfil {
            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.08);
        }


        .nome {
            font-size: 30px;

            margin: 0;
        }


        .idade {
            margin-top: 7px;

            color: #777;

            font-size: 17px;
        }


        .descricao {
            margin-top: 25px;

            font-size: 17px;

            line-height: 1.6;

            white-space: pre-line;
        }


        /* ==============================================
           MÍDIA PRINCIPAL
        ============================================== */

        .media-container {
            width: 100%;

            max-width: 650px;

            margin: 0 auto 25px;

            border-radius: 14px;

            overflow: hidden;

            background: #111;
        }


        .media-principal {
            width: 100%;

            max-height: 750px;

            display: block;

            object-fit: cover;

            background: #111;
        }


        .video-principal {
            width: 100%;

            max-height: 750px;

            display: block;

            object-fit: contain;

            background: #000;
        }


        /* ==============================================
           FOTOS ADICIONAIS
        ============================================== */

        .titulo-fotos {
            margin-top: 35px;

            margin-bottom: 15px;

            font-size: 22px;
        }


        .galeria {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(150px, 1fr));

            gap: 12px;
        }


        .galeria img {
            width: 100%;

            height: 190px;

            object-fit: cover;

            border-radius: 10px;

            cursor: pointer;

            transition: transform 0.2s;
        }


        .galeria img:hover {
            transform: scale(1.02);
        }


        /* ==============================================
           WHATSAPP
        ============================================== */

        .whatsapp {
            display: inline-block;

            margin-top: 30px;

            background: #25D366;

            color: white;

            text-decoration: none;

            padding: 14px 25px;

            border-radius: 8px;

            font-size: 17px;

            font-weight: bold;
        }


        .whatsapp:hover {
            background: #1ebe5d;
        }


        .carregando,
        .erro {
            text-align: center;

            padding: 50px 20px;

            color: #777;
        }


        @media (max-width: 600px) {

            header {
                padding: 12px 15px;
            }


            .logo {
                font-size: 19px;
            }


            .menu {
                gap: 3px;
            }


            .menu a,
            .menu button {
                font-size: 13px;

                padding: 7px 8px;
            }


            .container {
                padding: 20px 12px 40px;
            }


            .perfil {
                padding: 15px;
            }


            .nome {
                font-size: 25px;
            }


            .galeria {
                grid-template-columns:
                    repeat(2, 1fr);
            }


            .galeria img {
                height: 210px;
            }

        }

    </style>

</head>


<body>


<header>

    <a
        href="inicio.html"
        class="logo"
    >
        AcompanhanteVirtual
    </a>


    <div
        id="menuNaoLogado"
        class="menu"
    >

        <a href="index.html">
            Entrar
        </a>

        <a href="index.html">
            Criar conta
        </a>

    </div>


    <div
        id="menuLogado"
        class="menu escondido"
    >

        <a
            href="inicio.html"
            class="principal"
        >
            Início
        </a>

        <a href="perfil.html">
            Meu perfil
        </a>

        <button id="botaoSair">
            Sair
        </button>

    </div>

</header>



<main class="container">


    <a
        href="inicio.html"
        class="voltar"
    >
        ← Voltar
    </a>



    <div id="conteudo">

        <div class="carregando">
            Carregando perfil...
        </div>

    </div>


</main>



<script>


/* =====================================================
   MENU
===================================================== */

function mostrarMenuLogado(logado) {

    const menuNaoLogado =
        document.getElementById(
            "menuNaoLogado"
        );


    const menuLogado =
        document.getElementById(
            "menuLogado"
        );


    if (logado) {

        menuNaoLogado.classList.add(
            "escondido"
        );

        menuLogado.classList.remove(
            "escondido"
        );

    } else {

        menuNaoLogado.classList.remove(
            "escondido"
        );

        menuLogado.classList.add(
            "escondido"
        );

    }

}



/* =====================================================
   VERIFICAR LOGIN
===================================================== */

async function verificarLogin() {

    const resultado =
        await supabaseClient.auth.getSession();


    const session =
        resultado.data
            ? resultado.data.session
            : null;


    mostrarMenuLogado(!!session);

}



supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        mostrarMenuLogado(!!session);

    }
);



/* =====================================================
   SAIR
===================================================== */

document
    .getElementById("botaoSair")
    .addEventListener(
        "click",
        async function() {


            await supabaseClient.auth.signOut();


            window.location.href =
                "index.html";

        }
    );



/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto) {

    if (
        texto === null ||
        texto === undefined
    ) {
        return "";
    }


    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =====================================================
   PEGAR ID DA URL
===================================================== */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const acompanhanteId =
    parametros.get("id");



/* =====================================================
   CARREGAR PERFIL
===================================================== */

async function carregarPerfil() {


    const conteudo =
        document.getElementById(
            "conteudo"
        );


    if (!acompanhanteId) {

        conteudo.innerHTML = `
            <div class="erro">
                Perfil não encontrado.
            </div>
        `;

        return;

    }



    /* =================================================
       BUSCAR ACOMPANHANTE
    ================================================= */

    const resultado =
        await supabaseClient
            .from("acompanhantes")
            .select("*")
            .eq("id", acompanhanteId)
            .eq("ativo", true)
            .single();



    if (resultado.error) {

        console.error(
            resultado.error
        );


        conteudo.innerHTML = `
            <div class="erro">
                Não foi possível carregar este perfil.
            </div>
        `;

        return;

    }



    const acompanhante =
        resultado.data;



    /* =================================================
       BUSCAR FOTOS EXTRAS
    ================================================= */

    const fotosResultado =
        await supabaseClient
            .from("fotos_acompanhantes")
            .select("*")
            .eq(
                "acompanhante_id",
                acompanhanteId
            )
            .order("ordem", {
                ascending: true
            });



    const fotos =
        fotosResultado.data || [];



    /* =================================================
       MÍDIA PRINCIPAL
    ================================================= */

    let mediaPrincipal = "";



    if (
        acompanhante.tipo_midia_principal === "video"
        &&
        acompanhante.video_principal
    ) {


        mediaPrincipal = `

            <div class="media-container">

                <video
                    class="video-principal"
                    src="${escaparHTML(
                        acompanhante.video_principal
                    )}"
                    controls
                    autoplay
                    muted
                    loop
                    playsinline
                    preload="metadata"
                ></video>

            </div>

        `;


    } else {


        let foto =
            acompanhante.foto_principal;


        if (!foto) {

            foto =
                "https://via.placeholder.com/700x900?text=Sem+foto";

        }


        mediaPrincipal = `

            <div class="media-container">

                <img
                    class="media-principal"
                    src="${escaparHTML(foto)}"
                    alt="${escaparHTML(
                        acompanhante.nome
                    )}"
                >

            </div>

        `;

    }



    /* =================================================
       GALERIA DE FOTOS
    ================================================= */

    let galeriaHTML = "";



    if (fotos.length > 0) {


        galeriaHTML = `

            <h2 class="titulo-fotos">
                Fotos
            </h2>

            <div class="galeria">

        `;


        fotos.forEach(
            function(foto) {

                galeriaHTML += `

                    <img
                        src="${escaparHTML(
                            foto.foto_url
                        )}"
                        alt="Foto de ${escaparHTML(
                            acompanhante.nome
                        )}"
                        loading="lazy"
                        onclick="window.open(
                            '${escaparHTML(
                                foto.foto_url
                            )}',
                            '_blank'
                        )"
                    >

                `;

            }
        );


        galeriaHTML += `
            </div>
        `;

    }



    /* =================================================
       WHATSAPP
    ================================================= */

    let whatsappHTML = "";


    if (acompanhante.whatsapp) {


        let numero =
            String(
                acompanhante.whatsapp
            )
            .replace(/\D/g, "");


        if (numero) {

            whatsappHTML = `

                <a
                    class="whatsapp"
                    href="https://wa.me/${numero}"
                    target="_blank"
                    rel="noopener"
                >
                    Conversar pelo WhatsApp
                </a>

            `;

        }

    }



    /* =================================================
       MOSTRAR PERFIL
    ================================================= */

    conteudo.innerHTML = `

        <div class="perfil">

            ${mediaPrincipal}


            <h1 class="nome">
                ${escaparHTML(
                    acompanhante.nome
                )}
            </h1>


            <div class="idade">
                ${acompanhante.idade} anos
            </div>


            ${
                acompanhante.descricao
                    ? `
                        <div class="descricao">
                            ${escaparHTML(
                                acompanhante.descricao
                            )}
                        </div>
                    `
                    : ""
            }


            ${galeriaHTML}


            ${whatsappHTML}

        </div>

    `;

}



/* =====================================================
   INICIAR
===================================================== */

verificarLogin();

carregarPerfil();

</script>


</body>

</html>
